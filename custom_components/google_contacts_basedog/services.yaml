sync_birthdays_from_google_contacts:
  name: Sync Birthdays from Google Contacts
  description: Synchronisiert Google-Kontaktgeburtstage als ganztägige Ereignisse, vermeidet Duplikate und entfernt veraltete Einträge.
  fields:
    calendar:
      name: Kalender
      description: Zielkalender; muss Ereignisse erstellen und löschen können.
      required: true
      selector:
        entity:
          domain: calendar
    months:
      name: Monate
      description: Anzahl Monate in der Zukunft.
      required: true
      default: 12
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
