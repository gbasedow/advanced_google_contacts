name: Release

# Creates a GitHub release (and tag v<version>) whenever the version in
# manifest.json on main has no release yet. Can also be started manually.
on:
  push:
    branches: [main]
    paths:
      - custom_components/advanced_google_contacts/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: |
          version=$(jq -r .version custom_components/advanced_google_contacts/manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::No version in manifest.json"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          # Release notes: section "## <version> ..." from the integration changelog.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found=1; next } }
            found { print }
          ' custom_components/advanced_google_contacts/README.md > notes.md
          [ -s notes.md ] || echo "Advanced Google Contacts $VERSION" > notes.md
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Advanced Google Contacts $VERSION" \
            --notes-file notes.md
