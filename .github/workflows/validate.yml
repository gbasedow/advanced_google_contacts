name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and changelog
        run: .github/scripts/check_version.sh
      - name: Version must be new when it changed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/check_version.sh)
          base=$(git show "origin/${{ github.base_ref }}:custom_components/advanced_google_contacts/manifest.json" | jq -r .version)
          if [ "$version" != "$base" ] && gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists, bump the version in manifest.json"
            exit 1
          fi

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m compileall -q custom_components

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: images ship locally in custom_components/.../brand (HA 2026.3+).
          # description/topics/license: only required for the HACS default store,
          # not for installation as a custom repository.
          ignore: brands description topics license

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component pyyaml
          # local_calendar (the real target calendar in the tests) needs its pinned ical version
          ICAL=$(python -c "import json, homeassistant.components.local_calendar as m, pathlib; print(json.loads((pathlib.Path(m.__file__).parent / 'manifest.json').read_text())['requirements'][0])")
          pip install "$ICAL"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Run tests
        # Home Assistant must be imported before the test plugin (httpx aliasing).
        run: python -c "import sys, homeassistant, pytest; sys.exit(pytest.main(['-q', '-p', 'no:cacheprovider']))"
